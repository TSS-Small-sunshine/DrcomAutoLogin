name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/drcom-release.p12"
          test -s "$RUNNER_TEMP/drcom-release.p12"
          echo "keystore decoded: $(stat -c%s "$RUNNER_TEMP/drcom-release.p12") bytes"

      # 不传签名环境变量 -> Gradle 产出未签名包，签名交给下一步的 apksigner。
      # 原因：AGP 在 minSdk >= 24 时会忽略 enableV1Signing。
      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # 关键：必须显式传 --min-sdk-version 23。
      # apksigner 的规则是「min-sdk-version >= 24 则不生成 v1 签名」，
      # 它会从 manifest 读到 26 从而跳过 v1，即使写了 --v1-signing-enabled true。
      # 传 23 只影响「生成哪些签名方案」，APK 的真实 minSdk 仍是 26，装机门槛不变。
      - name: Sign APK with v1 + v2 + v3
        env:
          KS_PATH: ${{ runner.temp }}/drcom-release.p12
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"

          IN=$(ls app/build/outputs/apk/release/*unsigned*.apk 2>/dev/null | head -1 || true)
          if [ -z "$IN" ]; then IN=$(ls app/build/outputs/apk/release/*.apk | head -1); fi
          echo "unsigned input: $IN"

          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then echo "无法从 app/build.gradle.kts 解析 versionName"; exit 1; fi
          OUT="app/build/outputs/apk/release/DrcomAutoLogin-v${VERSION}-debug.apk"
          echo "versionName = $VERSION"

          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --ks "$KS_PATH" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" \
            "$RUNNER_TEMP/aligned.apk"

          echo "signed -> $OUT"

          echo ""
          echo "=== META-INF 条目（v1 签名文件按别名命名：DRCOM.SF / DRCOM.RSA）==="
          unzip -l "$OUT" | grep -i 'META-INF/' || true

      # 先上传产物，保证即使后面的验证失败也能拿到 APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrcomAutoLogin-APK
          path: app/build/outputs/apk/release/DrcomAutoLogin-v*-debug.apk
          if-no-files-found: error

      # 证据收集为主：全部输出先打印出来，再对必要项做硬判定
      - name: Verify APK (signature + manifest)
        run: |
          set -uo pipefail
          APK=$(ls app/build/outputs/apk/release/DrcomAutoLogin-v*-debug.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          echo "=== apksigner verify --verbose --print-certs ==="
          "$BT/apksigner" verify --verbose --print-certs "$APK" || true

          echo ""
          echo "=== META-INF 条目 ==="
          unzip -l "$APK" | grep -i 'META-INF/' || true

          echo ""
          echo "=== aapt2 badging ==="
          "$BT/aapt2" dump badging "$APK" | head -12 || true

          echo ""
          echo "=== sha256 ==="
          sha256sum "$APK"

          echo ""
          echo "=== 硬判定 ==="
          VERIFY=$("$BT/apksigner" verify --verbose "$APK" || true)
          echo "$VERIFY" | grep -qE 'Verified using v2 scheme.*true' \
            && echo "v2 签名: OK（必需项）" \
            || { echo "v2 签名缺失 —— 构建失败"; exit 1; }
          if echo "$VERIFY" | grep -qE 'Verified using v1 scheme.*true'; then
            echo "v1 签名: OK"
          else
            echo "v1 签名: 缺失（不阻断构建，仅告警）"
          fi
          echo "$VERIFY" | grep -qE 'Verified using v3 scheme.*true' \
            && echo "v3 签名: OK" \
            || echo "v3 签名: 缺失（不阻断构建，仅告警）"

      - name: Publish Release (tag debug)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          APK=$(ls app/build/outputs/apk/release/DrcomAutoLogin-v*-debug.apk | head -1)

          NOTES="自动构建的 **Debug 版** APK（正式 release 签名）。

          | 项 | 值 |
          | --- | --- |
          | 包名 | \`com.drcom.autologin\` |
          | 版本 | 1.1 (versionCode 2) |
          | APK 文件名 | \`DrcomAutoLogin-v${VERSION}-debug.apk\` |
          | 系统要求 | Android 8.0 (API 26) 及以上 |
          | 签名方案 | v1 (JAR) + v2 + v3 |
          | 构建提交 | \`${{ github.sha }}\` |
          | 构建编号 | #${{ github.run_number }} |

          **安装**：下载下面的 \`DrcomAutoLogin-v${VERSION}-debug.apk\`，传到手机安装（需允许「安装未知应用」）。

          > 本 Release 每次推送代码后由 CI 自动覆盖更新，Release 页面地址固定不变，但附件文件名会随版本变化（看版本号即可分辨新旧包）。"

          if gh release view debug >/dev/null 2>&1; then
            gh release delete debug --yes --cleanup-tag
          fi

          gh release create debug "$APK" \
            --title "Debug 构建 v${VERSION}（自动更新）" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"

          echo "=== Release 已发布 ==="
          gh release view debug --json url,tagName,name,isPrerelease,assets
